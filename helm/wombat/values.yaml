# Default values for wombat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: illuin/wombat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

environment: dev

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ""
  path: /
  pathType: Prefix
  tlsSecretName: ""
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  basicAuth:
    enabled: false
    username: ""
    # Password can be provided as plain text (hashed in chart) or secret ref
    password: ""
    realm: "Wombat Dashboard"
    existingSecret: ""

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

jvmOptions:
  xms: 512M
  xmx: 512M

# Persistence mode: SQLITE_TRANSIENT (in-memory SQLite, Deployment),
# SQLITE_WITH_BACKUP (file-backed SQLite, StatefulSet), or POSTGRESQL (existing PostgreSQL, Deployment)
persistence:
  type: SQLITE_TRANSIENT
  postgresql:
    existingSecret: ""
    passwordKey: password
  storageClassName: ""
  size: 10Gi
  backup:
    enabled: false
    cron: "0 0 2 * * ?"
    restoreOnStartup: true
    cleanup:
      cron: "0 0 3 * * ?"
      retainLast: 25
    s3:
      endpoint: ""
      bucket: ""
      accessKey: ""
      secretKey: ""
      region: ""
      keyPrefix: ""
      existingSecret: ""

# Sidecar or external dependencies for emissions calculation
dependencies:
  boaviztapi:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: ghcr.io/boavizta/boaviztapi
      tag: "2.4.1"
      pullPolicy: IfNotPresent
    port: 5001
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  ecologits:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: ghcr.io/mlco2/ecologits-api
      tag: "0.0.2"
      pullPolicy: IfNotPresent
    port: 5002
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# Application core configuration
config:
  monitor:
    # How often monitored assets are sampled: an amount and a unit, s, m or h
    heartbeat: "10s"
  ui:
    maxDateRange:
      duration: 1
      unit: YEARS

# Metric compaction (persistence.compaction): the app's defaults apply to what is left out
compaction: {}
#  cron: "0 1 * * * ?"  # a minute past every hour
#  window: 1h
#  delay: 1m

security:
  enabled: false
  oidc: {}
  auth: {}
# Example:
# security:
#   enabled: true
#   oidc:
#     auth-server-url: https://idp.example.com
#     client-id: wombat
#     credentials:
#       # Set exactly one of secret or existingSecret.
#       secret: CHANGEME
#       existingSecret: ""
#     authentication:
#       user-info-required: true
#   auth:
#     allowed-email-domains: [example.com]
#     email-claim: email
#     require-verified-email: true
#     display-name-claims: [email, name, preferred_username]
#     idp-logout: true
#     roles:
#       admin: [wombat-admins]
#       user: [wombat-users]

# Dynamic extensions storage
extensions:
  enabled: false
  mountPath: /extensions
  existingClaim: ""
  storageClassName: ""
  size: 1Gi

# The secret backends the app resolves secret keys from, such as a kubernetes-api asset's kubeconfig-key. Each one is
# optional.
secrets:
  # Secrets set with the deployment, by key. They are mounted under /secrets as the app's directory secret resolver, a
  # read-only secret backend. A key is made of letters, digits, "-" and "_".
  provisioned: {}
  # kubeconfig-my-cluster: |
  #   apiVersion: v1
  #   ...

# Generic application config overrides (merged into application.yaml)
configOverrides: {}

# Optional: environments and assets provisioned at startup, read-only in the app. Without any, they are created from
# the dashboard or the API.
monitoredEnvironments:
  # Assets are written as in the app's environments file, kebab-case, with the properties of their module: see
  # https://github.com/illuin-tech/wombat-core/tree/master/doc/module
  environments: {}
  # Example:
  # test:
  #   assets:
  #     - type: tech.illuin.wombat-module.kubernetes-api
  #       id: my-cluster
  #       kubeconfig-key: kubeconfig-my-cluster  # a key of secrets.provisioned, or of any other secret backend
  #       namespace: my-namespace
  #       profile:
  #         provider: aws
  #         instance-type: c5a.4xlarge
  #         location: FRA
  #         lifespan: 5y
  #     - type: tech.illuin.wombat-module.llm-static
  #       id: my-llm
  #       profile:
  #         zone-id: Europe/Paris
  #         models:
  #           - provider: mistralai
  #             model: mistral-large-latest
  #             location: FRA
  #             request-per-year: 9125000  # ~1000 users * 5 calls * 5 inferences * 365
  #             output-token-per-request: 300
  #             scenarios:
  #               - type: user_activity
  #                 opening-time: "08:00:00"
  #                 closing-time: "18:00:00"

nodeSelector: {}
tolerations: []
affinity: {}
