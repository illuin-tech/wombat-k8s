# Default values for wombat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: illuin/wombat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

environment: dev

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ""
  path: /
  pathType: Prefix
  tlsSecretName: ""
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  basicAuth:
    enabled: false
    username: ""
    # Password can be provided as plain text (hashed in chart) or secret ref
    password: ""
    realm: "Wombat Dashboard"
    existingSecret: ""

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

jvmOptions:
  xms: 512M
  xmx: 512M

# Persistence mode: SQLITE_TRANSIENT (Deployment) or SQLITE_WITH_BACKUP (StatefulSet)
persistence:
  type: SQLITE_TRANSIENT
  storageClassName: ""
  size: 10Gi
  backup:
    enabled: false
    cron: "0 0 2 * * ?"
    restoreOnStartup: true
    cleanup:
      cron: "0 0 3 * * ?"
      retainLast: 25
    s3:
      endpoint: ""
      bucket: ""
      accessKey: ""
      secretKey: ""
      region: ""
      keyPrefix: ""
      existingSecret: ""

# Sidecar or external dependencies for emissions calculation
dependencies:
  boaviztapi:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: ghcr.io/boavizta/boaviztapi
      tag: "2.4.1"
      pullPolicy: IfNotPresent
    port: 5001
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  ecologits:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: ghcr.io/mlco2/ecologits-api
      tag: "0.0.2"
      pullPolicy: IfNotPresent
    port: 5002
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# Application core configuration
config:
  monitor:
    heartbeat: "0 * * * * ?"
  metrics:
    aggregationWindow:
      duration: 5
      unit: MINUTES
  ui:
    maxDateRange:
      duration: 1
      unit: YEARS

# Dynamic extensions storage
extensions:
  enabled: false
  mountPath: /extensions
  existingClaim: ""
  storageClassName: ""
  size: 1Gi

# Generic runtime secrets mounted under /secrets
secrets: {}
# WOMBAT_PROMETHEUS_PASSWORD: "secret-password"

# Generic application config overrides (merged into application.yaml)
configOverrides: {}

# Monitored environments and assets configuration
monitoredEnvironments:
  environments: {}
  # Example:
  # test:
  #   name: Test Environment
  #   assets:
  #     - type: tech.illuin.wombat-module.kubernetes-api
  #       id: my-cluster
  #       name: My cluster (test)
  #       namespace: my-namespace
  #       configPath: /path/to/kubeconfig
  #       profile:
  #         provider: aws
  #         instanceType: c5a.4xlarge
  #         location: FRA
  #         lifespan: 43800 # hours
  #     - type: tech.illuin.wombat-module.llm-static
  #       id: my-llm
  #       name: My LLM (test)
  #       profile:
  #         models:
  #           - provider: mistralai
  #             model: mistral-large-latest
  #             location: FRA
  #             requestProfile:
  #               outputTokenCount: 300
  #               requestPerYear: 9125000
  kubeconfigs: []
  # - id: my-cluster
  #   content: |
  #     apiVersion: v1
  #     ...

nodeSelector: {}
tolerations: []
affinity: {}
