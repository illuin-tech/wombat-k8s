# Default values for wombat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: illuin/wombat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

environment: dev

# Deployment mode of this instance:
#   standalone: samples its environments into its own database (single-instance setup)
#   aggregator: stores and serves the metrics pushed by workers, samples nothing itself
#   worker:     samples its environments and pushes the metrics to an aggregator (requires SQLITE_TRANSIENT persistence)
mode: standalone

# Worker mode configuration, ignored in other modes
worker:
  # Owner of the environments this worker declares, unique among the workers of an aggregator
  id: ""
  aggregator:
    url: ""
    # API key holding api.metric.write and api.environment.write on the aggregator,
    # provided as plain text or through an existing Secret containing `api-key`
    apiKey: ""
    existingSecret: ""
    proxyUrl: ""
    timeout: ""
  environments:
    # Whether PUT /api/worker/environments also declares environments, on top of monitoredEnvironments: called by a process
    # next to the worker (e.g. one of the sidecars, listing the namespaces of its cluster). Requires an image supporting it.
    api: false

serviceAccount:
  create: false
  annotations: {}
  name: ""

# Additional containers of the pod, next to Wombat and its dependencies, e.g. one declaring the environments of a worker
# on http://localhost:8080/api/worker/environments (worker.environments.api: true). They share the pod's ServiceAccount.
sidecars: []

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ""
  path: /
  pathType: Prefix
  tlsSecretName: ""
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  basicAuth:
    enabled: false
    username: ""
    # Password can be provided as plain text (hashed in chart) or secret ref
    password: ""
    realm: "Wombat Dashboard"
    existingSecret: ""

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

jvmOptions:
  xms: 512M
  xmx: 512M

# Persistence mode: SQLITE_TRANSIENT (in-memory SQLite, Deployment),
# SQLITE_WITH_BACKUP (file-backed SQLite, StatefulSet), or POSTGRESQL (existing PostgreSQL, Deployment)
persistence:
  type: SQLITE_TRANSIENT
  postgresql:
    existingSecret: ""
    passwordKey: password
  storageClassName: ""
  size: 10Gi
  backup:
    enabled: false
    cron: "0 0 2 * * ?"
    restoreOnStartup: true
    cleanup:
      cron: "0 0 3 * * ?"
      retainLast: 25
    s3:
      endpoint: ""
      bucket: ""
      accessKey: ""
      secretKey: ""
      region: ""
      keyPrefix: ""
      existingSecret: ""

# Sidecar or external dependencies for emissions calculation
dependencies:
  boaviztapi:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: ghcr.io/boavizta/boaviztapi
      tag: "2.4.1"
      pullPolicy: IfNotPresent
    port: 5001
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  ecologits:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: ghcr.io/mlco2/ecologits-api
      tag: "0.0.2"
      pullPolicy: IfNotPresent
    port: 5002
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# Application core configuration
config:
  monitor:
    # How often monitored assets are sampled: an amount and a unit, s, m or h
    heartbeat: "10s"
  ui:
    maxDateRange:
      duration: 1
      unit: YEARS

# Metric compaction (persistence.compaction): the app's defaults apply to what is left out
compaction: {}
#  cron: "0 1 * * * ?"  # a minute past every hour
#  window: 1h
#  delay: 1m

# OIDC authentication, the app's oidc profile: see https://github.com/illuin-tech/wombat/blob/master/doc/access-control.md
security:
  enabled: false
  oidc: {}
  #  authServerUrl: https://idp.example.com  # the issuer URL
  #  clientId: wombat
  #  credentials:
  #    secret: CHANGEME  # the chart keeps it in a Secret
  #  authentication:
  #    scopes: [email, profile]
  #    userInfoRequired: true
  #    extraParams:
  #      prompt: select_account
  #  roles:  # where the provider puts its roles, e.g. for Keycloak
  #    roleClaimPath: realm_access/roles
  #    source: accesstoken
  auth: {}
  #  roles:  # provider roles or groups, emails, or "*" granting each Wombat role
  #    admin: [wombat-admins]
  #    user: [wombat-users]
  #    apiKeyManager: [wombat-key-managers]
  #  allowedEmailDomains: [example.com]
  #  emailClaim: email
  #  requireVerifiedEmail: true
  #  displayNameClaims: [email, name, preferred_username]
  #  idpLogout: true
  #  apiKeys:
  #    maxLifetime: 365d
  #    allowNeverExpiring: false

# Dynamic extensions storage
extensions:
  enabled: false
  mountPath: /extensions
  existingClaim: ""
  storageClassName: ""
  size: 1Gi

# The secret backends the app resolves secret keys from, such as a kubernetes-api asset's kubeconfig-key. Each one is
# optional. See https://github.com/illuin-tech/wombat/blob/master/doc/secret-management.md
secrets:
  # Secrets set with the deployment, by key. They are mounted under /secrets as the app's directory secret resolver, a
  # read-only secret backend. A key is made of letters, digits, "-" and "_".
  provisioned: {}
  # kubeconfig-my-cluster: |
  #   apiVersion: v1
  #   ...
  # Existing Secrets of the namespace, mounted under /secrets next to the provisioned ones: each of their keys is a secret
  existingSecrets: []
  # The backend behind the app's /api/secrets, and the first one it resolves from: disabled, database or vault
  writeMode: disabled
  # The database writer's key-encryption keys, used with writeMode database
  database:
    # One of the ids of kek
    activeKekId: ""
    # Base64 for 32 bytes (openssl rand -base64 32), by id. An id is made of lowercase letters, digits and "-".
    # With existingSecret, list the ids with empty values: the Secret holds each key under its id.
    kek: {}
    #  current: ""
    existingSecret: ""
  # HashiCorp Vault KV v2: a read-only resolver, or the writer with writeMode vault
  vault:
    enabled: false
    # The app's default: wombat
    pathPrefix: ""
    # The CA that signs Vault's certificate, in PEM: mounted, and set as client.tls.caCert
    caCert: ""
    # Written to quarkus.vault, in camelCase: see https://docs.quarkiverse.io/quarkus-vault/dev/index.html
    client: {}
    #  url: https://vault.example.com
    #  kvSecretEngineMountPath: secret
    #  authentication:  # exactly one of kubernetes, appRole or clientToken
    #    kubernetes:
    #      role: wombat  # bound to the pod's ServiceAccount, see serviceAccount
    #    appRole:
    #      roleId: CHANGEME
    #      secretId: CHANGEME  # the chart keeps it in a Secret
    #    clientToken: CHANGEME  # the chart keeps it in a Secret
  cache:
    # How long a resolved secret is kept in memory, e.g. 10m (the app's default). 0 disables the cache.
    ttl: ""

# Generic application config overrides (merged into application.yaml)
configOverrides: {}

# Optional: environments and assets provisioned at startup, read-only in the app. Without any, they are created from
# the dashboard or the API.
monitoredEnvironments:
  # Assets are written as in the app's environments file, kebab-case, with the properties of their module: see
  # https://github.com/illuin-tech/wombat-core/tree/master/doc/module
  environments: {}
  # Example:
  # test:
  #   assets:
  #     - type: tech.illuin.wombat-module.kubernetes-api
  #       id: my-cluster
  #       kubeconfig-key: kubeconfig-my-cluster  # a key of secrets.provisioned, or of any other secret backend
  #       namespace: my-namespace
  #       profile:
  #         provider: aws
  #         instance-type: c5a.4xlarge
  #         location: FRA
  #         lifespan: 5y
  #     - type: tech.illuin.wombat-module.llm-static
  #       id: my-llm
  #       profile:
  #         zone-id: Europe/Paris
  #         models:
  #           - provider: mistralai
  #             model: mistral-large-latest
  #             location: FRA
  #             request-per-year: 9125000  # ~1000 users * 5 calls * 5 inferences * 365
  #             output-token-per-request: 300
  #             scenarios:
  #               - type: user_activity
  #                 opening-time: "08:00:00"
  #                 closing-time: "18:00:00"

nodeSelector: {}
tolerations: []
affinity: {}
