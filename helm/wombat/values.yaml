# Default values for wombat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: illuin/wombat
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

environment: dev

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: ""
  path: /
  pathType: Prefix
  tlsSecretName: ""
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  basicAuth:
    enabled: false
    username: ""
    # Password can be provided as plain text (hashed in chart) or secret ref
    password: ""
    realm: "Wombat Dashboard"
    existingSecret: ""

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 200m
    memory: 512Mi

jvmOptions:
  xms: 512M
  xmx: 512M

# Persistence mode: SQLITE_TRANSIENT (Deployment) or SQLITE_WITH_BACKUP (StatefulSet)
persistence:
  type: SQLITE_TRANSIENT
  storageClassName: ""
  size: 10Gi
  backup:
    enabled: false
    cron: "0 0 2 * * ?"
    s3:
      endpoint: ""
      bucket: ""
      accessKey: ""
      secretKey: ""
      region: ""
      keyPrefix: ""
      existingSecret: ""

# Sidecar or external dependencies for emissions calculation
dependencies:
  boaviztapi:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: boavizta/boaviztapi
      tag: "2.4.1"
      pullPolicy: IfNotPresent
    port: 5000
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  ecologits:
    type: CONTAINER # CONTAINER or EXTERNAL
    endpoint: ""
    image:
      repository: ecologits/ecologits
      tag: "0.0.2"
      pullPolicy: IfNotPresent
    port: 5001
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# Dynamic extensions storage
extensions:
  enabled: false
  mountPath: /extensions
  existingClaim: ""
  storageClassName: ""
  size: 1Gi

# Generic runtime secrets mounted under /secrets
secrets: {}
# WOMBAT_PROMETHEUS_PASSWORD: "secret-password"

# Generic application config overrides (merged into application.yaml)
configOverrides: {}

# Monitored environments and assets configuration
monitoredEnvironments:
  heartbeat: "0 * * * * ?"
  environments: {}
  # Example:
  # dev-cluster:
  #   id: dev-cluster
  #   name: Dev Cluster
  #   assets:
  #     - type: KUBERNETES_API
  #       id: k8s-dev
  #       name: Dev K8s
  #       environmentId: dev-cluster
  #       profile:
  #         type: KUBERNETES_API
  #         cluster-name: dev
  #         poll-interval: 60s
  kubeconfigs: []
  # - id: dev-cluster
  #   content: |
  #     apiVersion: v1
  #     ...

nodeSelector: {}
tolerations: []
affinity: {}
