{{- $vault := .Values.secrets.vault | default dict }}
{{- if and $vault.enabled $vault.caCert -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wombat.fullname" . }}-vault-ca
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
data:
  ca.pem: |
    {{- $vault.caCert | nindent 4 }}
{{- end }}
