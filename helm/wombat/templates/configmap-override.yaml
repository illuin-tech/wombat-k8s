apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wombat.fullname" . }}-override
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
data:
  application.yaml: |
    {{- $config := dict }}
    {{- $wombat := dict }}
    {{- $persistence := dict }}
    {{- $sqlite := dict }}
    {{- $mode := "sqlite" }}
    {{- if eq .Values.persistence.type "POSTGRESQL" }}
      {{- $mode = "postgresql" }}
    {{- else if not (or (eq .Values.persistence.type "SQLITE_TRANSIENT") (eq .Values.persistence.type "SQLITE_WITH_BACKUP")) }}
      {{- fail (printf "Unsupported persistence.type: %s" .Values.persistence.type) }}
    {{- end }}
    {{- if eq .Values.persistence.type "SQLITE_TRANSIENT" }}
      {{- $_ := set $sqlite "jdbc-url" "jdbc:sqlite::memory:" }}
      {{- $_ := set $sqlite "backup" (dict "enabled" false) }}
    {{- else if and (eq .Values.persistence.type "SQLITE_WITH_BACKUP") (not .Values.persistence.backup.enabled) }}
      {{- $_ := set $sqlite "jdbc-url" "jdbc:sqlite:/var/tmp/wombat.db" }}
      {{- $_ := set $sqlite "backup" (dict "enabled" false) }}
    {{- else if eq .Values.persistence.type "SQLITE_WITH_BACKUP" }}
      {{- $_ := set $sqlite "jdbc-url" "jdbc:sqlite:/var/tmp/wombat.db" }}
      {{- $backup := dict "enabled" true }}
      {{- if .Values.persistence.backup.cron }}
        {{- $_ := set $backup "cron" .Values.persistence.backup.cron }}
      {{- end }}
      {{- if hasKey .Values.persistence.backup "restoreOnStartup" }}
        {{- $_ := set $backup "restore-on-startup" .Values.persistence.backup.restoreOnStartup }}
      {{- end }}
      {{- if .Values.persistence.backup.cleanup }}
        {{- $cleanup := dict "enabled" true }}
        {{- if .Values.persistence.backup.cleanup.cron }}{{ $_ := set $cleanup "cron" .Values.persistence.backup.cleanup.cron }}{{ end }}
        {{- if .Values.persistence.backup.cleanup.retainLast }}{{ $_ := set $cleanup "retain-last" .Values.persistence.backup.cleanup.retainLast }}{{ end }}
        {{- $_ := set $backup "cleanup" $cleanup }}
      {{- end }}
      {{- if .Values.persistence.backup.s3 }}
        {{- $s3 := dict }}
        {{- if .Values.persistence.backup.s3.endpoint }}{{ $_ := set $s3 "endpoint" .Values.persistence.backup.s3.endpoint }}{{ end }}
        {{- if .Values.persistence.backup.s3.bucket }}{{ $_ := set $s3 "bucket" .Values.persistence.backup.s3.bucket }}{{ end }}
        {{- if .Values.persistence.backup.s3.region }}{{ $_ := set $s3 "region" .Values.persistence.backup.s3.region }}{{ end }}
        {{- if .Values.persistence.backup.s3.keyPrefix }}{{ $_ := set $s3 "key-prefix" .Values.persistence.backup.s3.keyPrefix }}{{ end }}
        {{- /* Credentials come from the WOMBAT_BACKUP_S3_* env vars set on the StatefulSet */}}
        {{- if or .Values.persistence.backup.s3.existingSecret .Values.persistence.backup.s3.accessKey }}
          {{- $_ := set $s3 "access-key" "${WOMBAT_BACKUP_S3_ACCESS_KEY}" }}
          {{- $_ := set $s3 "secret-key" "${WOMBAT_BACKUP_S3_SECRET_KEY}" }}
        {{- end }}
        {{- $_ := set $backup "s3" $s3 }}
      {{- end }}
      {{- $_ := set $sqlite "backup" $backup }}
    {{- end }}
    {{- $backend := dict "mode" $mode }}
    {{- if eq $mode "sqlite" }}
      {{- $_ := set $backend "sqlite" $sqlite }}
    {{- end }}
    {{- $_ := set $persistence "backend" $backend }}
    {{- with .Values.compaction }}
      {{- $compaction := dict }}
      {{- if .cron }}{{ $_ := set $compaction "cron" .cron }}{{ end }}
      {{- if .window }}{{ $_ := set $compaction "window" .window }}{{ end }}
      {{- if .delay }}{{ $_ := set $compaction "delay" .delay }}{{ end }}
      {{- $_ := set $persistence "compaction" $compaction }}
    {{- end }}
    {{- $_ := set $config "persistence" $persistence }}

    {{- if not (has .Values.mode (list "standalone" "aggregator" "worker")) }}
      {{- fail (printf "Unsupported mode: %s" .Values.mode) }}
    {{- end }}
    {{- /* Only set outside the default standalone mode, which images predating the distributed setup do not know */}}
    {{- if ne .Values.mode "standalone" }}
      {{- $_ := set $wombat "mode" .Values.mode }}
      {{- $_ := set $config "wombat" $wombat }}
    {{- end }}
    {{- if eq .Values.mode "worker" }}
      {{- /* Workers write no metric to their database and always run on an in-memory SQLite one */}}
      {{- if ne .Values.persistence.type "SQLITE_TRANSIENT" }}
        {{- fail "mode worker requires persistence.type SQLITE_TRANSIENT" }}
      {{- end }}
      {{- if not (and .Values.worker.id .Values.worker.aggregator.url) }}
        {{- fail "mode worker requires worker.id and worker.aggregator.url" }}
      {{- end }}
      {{- if not (or .Values.worker.aggregator.apiKey .Values.worker.aggregator.existingSecret) }}
        {{- fail "mode worker requires worker.aggregator.apiKey or worker.aggregator.existingSecret" }}
      {{- end }}
      {{- $aggregator := dict "url" .Values.worker.aggregator.url }}
      {{- if .Values.worker.aggregator.proxyUrl }}{{ $_ := set $aggregator "proxy-url" .Values.worker.aggregator.proxyUrl }}{{ end }}
      {{- if .Values.worker.aggregator.timeout }}{{ $_ := set $aggregator "timeout" .Values.worker.aggregator.timeout }}{{ end }}
      {{- /* The API key comes from the WOMBAT_WORKER_AGGREGATOR_API_KEY env var set on the Deployment */}}
      {{- $worker := dict "id" .Values.worker.id "aggregator" $aggregator }}
      {{- if (.Values.worker.environments).api }}
        {{- /* Left unset by default, as images predating the setting do not know it */}}
        {{- $_ := set $worker "environments" (dict "api" true) }}
      {{- end }}
      {{- $_ := set $wombat "worker" $worker }}
    {{- end }}

    {{- $settings := dict }}
    {{- if eq .Values.dependencies.boaviztapi.type "CONTAINER" }}
      {{- $_ := set $settings "tech.illuin.wombat-module.boavizta" (dict "uri" "http://localhost:5001/v1/") }}
    {{- else if .Values.dependencies.boaviztapi.endpoint }}
      {{- $_ := set $settings "tech.illuin.wombat-module.boavizta" (dict "uri" .Values.dependencies.boaviztapi.endpoint) }}
    {{- end }}

    {{- if eq .Values.dependencies.ecologits.type "CONTAINER" }}
      {{- $_ := set $settings "tech.illuin.wombat-module.ecologits" (dict "uri" "http://localhost:5002/") }}
    {{- else if .Values.dependencies.ecologits.endpoint }}
      {{- $_ := set $settings "tech.illuin.wombat-module.ecologits" (dict "uri" .Values.dependencies.ecologits.endpoint) }}
    {{- end }}
    {{- if $settings }}
      {{- $_ := set $wombat "module" (dict "settings" $settings) }}
    {{- end }}

    {{- if .Values.config }}
      {{- if .Values.config.monitor }}
        {{- $monitor := dict }}
        {{- if .Values.config.monitor.heartbeat }}{{ $_ := set $monitor "heartbeat" .Values.config.monitor.heartbeat }}{{ end }}
        {{- $_ := set $wombat "monitor" $monitor }}
      {{- end }}
      {{- if .Values.config.ui }}
        {{- $ui := dict }}
        {{- if .Values.config.ui.maxDateRange }}
          {{- $maxDate := dict }}
          {{- if .Values.config.ui.maxDateRange.duration }}{{ $_ := set $maxDate "duration" .Values.config.ui.maxDateRange.duration }}{{ end }}
          {{- if .Values.config.ui.maxDateRange.unit }}{{ $_ := set $maxDate "unit" .Values.config.ui.maxDateRange.unit }}{{ end }}
          {{- $_ := set $ui "max-date-range" $maxDate }}
        {{- end }}
        {{- $_ := set $config "ui" $ui }}
      {{- end }}
    {{- end }}

    {{- $secrets := .Values.secrets }}
    {{- $secret := dict }}
    {{- if or $secrets.provisioned $secrets.existingSecrets }}
      {{- $_ := set $secret "directory" (dict "path" "/secrets") }}
    {{- end }}
    {{- $writeMode := $secrets.writeMode | default "disabled" }}
    {{- if not (has $writeMode (list "disabled" "database" "vault")) }}
      {{- fail (printf "Unsupported secrets.writeMode: %s" $writeMode) }}
    {{- end }}
    {{- if ne $writeMode "disabled" }}
      {{- $_ := set $secret "write-mode" $writeMode }}
    {{- end }}
    {{- if eq $writeMode "database" }}
      {{- $database := $secrets.database | default dict }}
      {{- $keks := $database.kek | default dict }}
      {{- if not $keks }}
        {{- fail "secrets.writeMode database requires at least one secrets.database.kek" }}
      {{- end }}
      {{- $kek := dict }}
      {{- range $id, $value := $keks }}
        {{- if not (regexMatch "^[a-z0-9-]+$" $id) }}
          {{- fail (printf "Unsupported secrets.database.kek id: %s. An id is made of lowercase letters, digits and \"-\"" $id) }}
        {{- end }}
        {{- if and $database.existingSecret $value }}
          {{- fail (printf "secrets.database.kek.%s must be empty with secrets.database.existingSecret, which holds it" $id) }}
        {{- else if not (or $database.existingSecret $value) }}
          {{- fail (printf "secrets.database.kek.%s is empty" $id) }}
        {{- end }}
        {{- /* The key comes from the env var set on the workload, see wombat.secretsEnv */}}
        {{- $_ := set $kek $id (printf "${WOMBAT_SECRET_DATABASE_KEK_%s}" ($id | replace "-" "_" | upper)) }}
      {{- end }}
      {{- if not (hasKey $keks (toString $database.activeKekId)) }}
        {{- fail (printf "secrets.database.activeKekId must be one of the secrets.database.kek ids: %s" (keys $keks | sortAlpha | join ", ")) }}
      {{- end }}
      {{- $_ := set $secret "database" (dict "active-kek-id" $database.activeKekId "kek" $kek) }}
    {{- end }}
    {{- $vault := $secrets.vault | default dict }}
    {{- if and (eq $writeMode "vault") (not $vault.enabled) }}
      {{- fail "secrets.writeMode vault requires secrets.vault.enabled" }}
    {{- end }}
    {{- if $vault.enabled }}
      {{- $vaultConfig := dict "enabled" true }}
      {{- if $vault.pathPrefix }}{{ $_ := set $vaultConfig "path-prefix" $vault.pathPrefix }}{{ end }}
      {{- $_ := set $secret "vault" $vaultConfig }}
      {{- $client := include "wombat.kebabize" ($vault.client | default dict) | fromYaml }}
      {{- if not $client.url }}
        {{- fail "secrets.vault.client.url is required when secrets.vault.enabled is true" }}
      {{- end }}
      {{- $authentication := $client.authentication | default dict }}
      {{- $methods := 0 }}
      {{- range $method := list "kubernetes" "app-role" "client-token" }}
        {{- if hasKey $authentication $method }}{{ $methods = add1 $methods }}{{ end }}
      {{- end }}
      {{- if ne $methods 1 }}
        {{- fail "secrets.vault.client.authentication requires exactly one of kubernetes, appRole or clientToken" }}
      {{- end }}
      {{- if and (hasKey $authentication "kubernetes") (not (get $authentication "kubernetes" | default dict).role) }}
        {{- fail "secrets.vault.client.authentication.kubernetes.role is required" }}
      {{- end }}
      {{- /* The credentials are kept in the -vault Secret, and come from the env vars set on the workload */}}
      {{- with get $authentication "app-role" }}
        {{- if not (and (get . "role-id") (get . "secret-id")) }}
          {{- fail "secrets.vault.client.authentication.appRole requires roleId and secretId" }}
        {{- end }}
        {{- $_ := set . "secret-id" "${QUARKUS_VAULT_AUTHENTICATION_APP_ROLE_SECRET_ID}" }}
      {{- end }}
      {{- if hasKey $authentication "client-token" }}
        {{- $_ := set $authentication "client-token" "${QUARKUS_VAULT_AUTHENTICATION_CLIENT_TOKEN}" }}
      {{- end }}
      {{- if $vault.caCert }}
        {{- $tls := $client.tls | default dict }}
        {{- if hasKey $tls "ca-cert" }}
          {{- fail "secrets.vault.caCert and secrets.vault.client.tls.caCert cannot both be set" }}
        {{- end }}
        {{- $_ := set $tls "ca-cert" "/etc/wombat/vault/ca.pem" }}
        {{- $_ := set $client "tls" $tls }}
      {{- end }}
      {{- $_ := set $config "quarkus" (dict "vault" $client) }}
    {{- end }}
    {{- $ttl := ($secrets.cache | default dict).ttl }}
    {{- if and (not (kindIs "invalid" $ttl)) (ne (toString $ttl) "") }}
      {{- $_ := set $secret "cache" (dict "ttl" $ttl) }}
    {{- end }}
    {{- if $secret }}
      {{- $_ := set $wombat "secret" $secret }}
    {{- end }}

    {{- if .Values.extensions.enabled }}
      {{- $module := $wombat.module | default dict }}
      {{- $_ := set $module "extension" (dict "path" (.Values.extensions.mountPath | default "/extensions")) }}
      {{- $_ := set $wombat "module" $module }}
    {{- end }}
    {{- if $wombat }}
      {{- $_ := set $config "wombat" $wombat }}
    {{- end }}

    {{- $security := .Values.security }}
    {{- if $security.enabled }}
      {{- $oidc := include "wombat.kebabize" $security.oidc | fromYaml }}
      {{- /* The client secret is kept in the -oidc Secret, and comes from the env var set on the workload */}}
      {{- $credentials := $oidc.credentials | default dict }}
      {{- $_ := set $credentials "secret" "${QUARKUS_OIDC_CREDENTIALS_SECRET}" }}
      {{- $_ := set $oidc "credentials" $credentials }}
      {{- $quarkus := $config.quarkus | default dict }}
      {{- $_ := set $quarkus "oidc" $oidc }}
      {{- $_ := set $config "quarkus" $quarkus }}
      {{- $_ := set $config "auth" (include "wombat.kebabize" $security.auth | fromYaml) }}
    {{- end }}

    {{- $merged := mergeOverwrite $config .Values.configOverrides }}
    {{- if ne $merged.persistence.backend.mode $mode }}
      {{- fail "configOverrides.persistence.backend.mode must match persistence.type" }}
    {{- end }}
    {{- if $security.enabled }}
      {{- if not (index $merged.quarkus.oidc "auth-server-url") }}
        {{- fail "security.oidc.authServerUrl is required when security.enabled is true" }}
      {{- end }}
      {{- if not (index $merged.quarkus.oidc "client-id") }}
        {{- fail "security.oidc.clientId is required when security.enabled is true" }}
      {{- end }}
      {{- if not ($security.oidc.credentials | default dict).secret }}
        {{- fail "security.oidc.credentials.secret is required when security.enabled is true" }}
      {{- end }}
      {{- if not (dig "roles" "admin" "" $merged.auth) }}
        {{- fail "security.auth.roles.admin is required when security.enabled is true, or nobody can administer Wombat" }}
      {{- end }}
    {{- end }}
    {{- toYaml $merged | nindent 4 }}
