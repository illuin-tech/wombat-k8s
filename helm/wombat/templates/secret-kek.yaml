{{- $database := .Values.secrets.database | default dict }}
{{- if and (eq .Values.secrets.writeMode "database") (not $database.existingSecret) $database.kek -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wombat.fullname" . }}-secret-kek
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* Validated in configmap-override.yaml */}}
  {{- range $id, $value := $database.kek }}
  {{ $id }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
