{{- $vault := .Values.secrets.vault | default dict }}
{{- $authentication := ($vault.client | default dict).authentication | default dict }}
{{- $secretId := ($authentication.appRole | default dict).secretId }}
{{- if and $vault.enabled (or $authentication.clientToken $secretId) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wombat.fullname" . }}-vault
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with $authentication.clientToken }}
  client-token: {{ . | toString | b64enc | quote }}
  {{- end }}
  {{- with $secretId }}
  app-role-secret-id: {{ . | toString | b64enc | quote }}
  {{- end }}
{{- end }}
