{{- if .Values.security.enabled }}
{{- $oidc := .Values.security.oidc | default dict }}
{{- $credentials := $oidc.credentials | default dict }}
{{- if and (not $credentials.existingSecret) $credentials.secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wombat.fullname" . }}-oidc
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ $credentials.secret | b64enc | quote }}
{{- end }}
{{- end }}
