{{- $clientSecret := (.Values.security.oidc.credentials | default dict).secret }}
{{- if and .Values.security.enabled $clientSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wombat.fullname" . }}-oidc
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ $clientSecret | b64enc | quote }}
{{- end }}
