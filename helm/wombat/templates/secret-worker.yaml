{{- if and (eq .Values.mode "worker") .Values.worker.aggregator.apiKey (not .Values.worker.aggregator.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wombat.fullname" . }}-worker
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ .Values.worker.aggregator.apiKey | b64enc | quote }}
{{- end }}
