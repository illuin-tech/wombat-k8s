{{- if or (eq .Values.persistence.type "SQLITE_TRANSIENT") (eq .Values.persistence.type "POSTGRESQL") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wombat.fullname" . }}
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wombat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config-override: {{ include (print $.Template.BasePath "/configmap-override.yaml") . | sha256sum }}
        checksum/config-monitored: {{ include (print $.Template.BasePath "/configmap-monitored.yaml") . | sha256sum }}
        checksum/oidc-secret: {{ include (print $.Template.BasePath "/secret-oidc.yaml") . | sha256sum }}
        checksum/kek-secret: {{ include (print $.Template.BasePath "/secret-kek.yaml") . | sha256sum }}
        checksum/vault-secret: {{ include (print $.Template.BasePath "/secret-vault.yaml") . | sha256sum }}
        checksum/vault-ca: {{ include (print $.Template.BasePath "/configmap-vault-ca.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "wombat.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wombat.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: wombat
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms{{ .Values.jvmOptions.xms }} -Xmx{{ .Values.jvmOptions.xmx }}"
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /deployments/config/application.yaml
            - name: WOMBAT_MONITOR_ENVIRONMENTS_FILE
              value: /monitored/monitored-environments.yaml
            {{- include "wombat.oidcEnv" . | nindent 12 }}
            {{- with include "wombat.secretsEnv" . }}{{ . | trim | nindent 12 }}{{ end }}
            {{- if and (eq .Values.persistence.type "POSTGRESQL") .Values.persistence.postgresql.existingSecret }}
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.persistence.postgresql.existingSecret | quote }}
                  key: {{ .Values.persistence.postgresql.passwordKey | quote }}
            {{- end }}
            {{- include "wombat.persistenceEnv" . | nindent 12 }}
            {{- if eq .Values.mode "worker" }}
            - name: WOMBAT_WORKER_AGGREGATOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.worker.aggregator.existingSecret | default (printf "%s-worker" (include "wombat.fullname" .)) | quote }}
                  key: api-key
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: conf-override
              mountPath: /deployments/config
            - name: conf-monitored
              mountPath: /monitored
            {{- with include "wombat.secretsVolumeMounts" . }}{{ . | trim | nindent 12 }}{{ end }}
            {{- if .Values.extensions.enabled }}
            - name: extensions
              mountPath: {{ .Values.extensions.mountPath | default "/extensions" }}
            {{- end }}
        {{- if eq .Values.dependencies.boaviztapi.type "CONTAINER" }}
        - name: boaviztapi
          image: "{{ .Values.dependencies.boaviztapi.image.repository }}:{{ .Values.dependencies.boaviztapi.image.tag }}"
          imagePullPolicy: {{ .Values.dependencies.boaviztapi.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: boaviztapi
              containerPort: 5001
              protocol: TCP
          args:
            - "uvicorn"
            - "boaviztapi.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "5001"
          resources:
            {{- toYaml .Values.dependencies.boaviztapi.resources | nindent 12 }}
        {{- end }}
        {{- if eq .Values.dependencies.ecologits.type "CONTAINER" }}
        - name: ecologits
          image: "{{ .Values.dependencies.ecologits.image.repository }}:{{ .Values.dependencies.ecologits.image.tag }}"
          imagePullPolicy: {{ .Values.dependencies.ecologits.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: ecologits
              containerPort: 5002
              protocol: TCP
          args:
            - "/app/.venv/bin/fastapi"
            - "run"
            - "app/main.py"
            - "--port"
            - "5002"
            - "--host"
            - "0.0.0.0"
          resources:
            {{- toYaml .Values.dependencies.ecologits.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: conf-override
          configMap:
            name: {{ include "wombat.fullname" . }}-override
        - name: conf-monitored
          configMap:
            name: {{ include "wombat.fullname" . }}-monitored
        {{- with include "wombat.secretsVolumes" . }}{{ . | trim | nindent 8 }}{{ end }}
        {{- if .Values.extensions.enabled }}
        - name: extensions
          persistentVolumeClaim:
            claimName: {{ .Values.extensions.existingClaim | default (printf "%s-extensions" (include "wombat.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
