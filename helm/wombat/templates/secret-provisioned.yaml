{{- if .Values.secrets.provisioned }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wombat.fullname" . }}-secrets
  labels:
    {{- include "wombat.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secrets.provisioned }}
  {{- /* The app's own secret key format, which its asset forms and key checks enforce */}}
  {{- if not (regexMatch "^[A-Za-z0-9_-]+$" $key) }}
    {{- fail (printf "Unsupported secrets.provisioned key: %s. A key is made of letters, digits, \"-\" and \"_\"" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
