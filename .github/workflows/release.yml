name: Release and Publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    name: Publish NPM Pulumi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: pulumi/package-lock.json
      - name: Extract version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Update package version and build
        working-directory: pulumi
        run: |
          npm version ${VERSION} --no-git-tag-version
          npm ci
          npm run build
      - name: Publish to NPM
        working-directory: pulumi
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-helm:
    name: Publish Helm Chart to Docker Hub OCI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Extract version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
      - name: Log in to Docker Hub OCI Registry
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Package Helm Chart
        run: |
          helm package helm/wombat --version ${VERSION} --app-version ${VERSION}
      - name: Push Helm Chart OCI
        run: |
          helm push wombat-${VERSION}.tgz oci://registry-1.docker.io/illuin
